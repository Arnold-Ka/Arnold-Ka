# To copy into the profile repository Arnold-Ka/Arnold-Ka as .github/workflows/profile-cards.yml.
# Every night it draws the statistics cards (SVG) into profile-summary-card-output/ of that
# repository, which the README shows: no public server to be down or rate-limited.
# Private repositories: add a personal token (scope "repo") as the secret PROFILE_CARDS_TOKEN,
# otherwise only public activity is counted. The token only READS the statistics: the cards are
# pushed by the workflow's own key (contents: write), with a commit step of our own instead of
# the action's automatic push (that one failed with « git push … Invalid status code: 1 »).
name: Profile cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Draw the cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_CARDS_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          AUTO_PUSH: false

      - name: Commit the cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          git diff --cached --quiet && echo "Cartes inchangées" && exit 0
          git commit -m "Mise à jour des cartes du profil"
          git push
